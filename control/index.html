<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>紅包汽球抽起來｜操作控制台</title>
<link rel="stylesheet" href="../public/original.css">
<link rel="stylesheet" href="../public/app.css">
<link rel="stylesheet" href="../site/static.css"></head>
<body>
<main class="compatPage">
<header class="compatHeader">
  <div><span>操作控制台</span><h1>紅包汽球抽起來</h1><p>選人、選獎區、加入佇列並開獎。</p></div>
  <div class="compatStatus"><b id="connection">● 讀取中</b><small id="updated"></small>
    <a href="../projection/" target="_blank" rel="noopener">開啟投影畫面 ↗</a>
    <button type="button" id="resetButton" class="warningButton">清除待抽／目前畫面</button>
  </div>
</header>
<section class="localNotice">
  <strong>免登入・手機電腦同步操作</strong>
  <span>開啟即可新增與抽獎，不用 Google 登入。公開控制台只保存抽獎資料；商品、手收和獎金數字會另存至無法公開讀取的內部明細區。任何取得控制台網址的人都能操作，請妥善保管網址。</span>
</section>
<section class="backupProtection">
  <div><strong>活動資料保護</strong><span id="counts">正在連接 Firebase…</span>
    <small id="lastSaved"></small>
  </div>
  <div class="backupActions">
    <button type="button" id="exportButton">匯出公開操作紀錄 JSON</button>
  </div>
</section>
<section class="compatGrid">
  <section class="compatPanel"><div class="compatTitle"><b>01</b><div>
    <small>CHOOSE PERSON</small><h2>挑選抽獎人</h2></div></div>
    <div class="compatPeople" id="people"></div>
  </section>
  <section class="compatPanel"><div class="compatTitle"><b>02</b><div>
    <small>CHOOSE ZONE</small><h2>挑戰獎區</h2></div></div>
    <div class="compatZones" id="zones"></div>
    <form class="noteForm" id="enqueueForm">
      <h3>新增內部明細（僅可寫入，其他裝置無法公開查閱）</h3>
      <div class="noteFields">
        <label>商品<input name="product" type="text" list="productSuggestions" maxlength="60" placeholder="輸入商品名稱" required>
          <datalist id="productSuggestions"><option value="基金"><option value="海外債"><option value="FCN"><option value="保險"></datalist>
        </label>
        <label>手收<input name="handReceipt" type="number" min="0" step="any" inputmode="decimal" placeholder="輸入數字"></label>
        <label>獎金<input name="bonusAmount" type="number" min="0" step="any" inputmode="decimal" placeholder="輸入數字"></label>
      </div>
      <button type="submit" class="compatEnqueue" id="enqueueButton" disabled>＋ 儲存內部明細並加入佇列<small>先選姓名與獎區</small></button>
    </form>
  </section>
  <section class="compatStage">
    <div class="compatTitle"><b>03</b><div><small>LIVE DRAW</small><h2>同步開獎</h2></div></div>
    <div class="compatReady" id="ready"><span>福</span><p>準備中…</p></div>
    <div class="compatQueue" id="queue"></div>
    <div class="compatHistory" id="history"></div>
  </section>
</section>
<div id="notice" aria-live="polite" role="status"></div>
</main>
<script type="module" src="../site/open-control.js"></script>
</body></html>
